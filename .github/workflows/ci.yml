name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/agent-core/pyproject.toml
      - name: Install Core
        run: python -m pip install -e "services/agent-core[test]"
      - name: Test Core
        working-directory: services/agent-core
        run: python -m unittest discover -s tests -v
      # Codex: deterministic lifecycle guard needs no local model or credentials.
      - name: Test Windows startup lifecycle
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-startup.ps1
      - name: Test Windows TTS lifecycle (isolated logic, no models)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-tts-lifecycle.ps1

  docs-guard:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Core (test extra for unittest discovery)
        run: python -m pip install -e "services/agent-core[test]"
      - name: Documentation consistency guard
        run: python scripts/check_docs_consistency.py

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Build desktop shell
        run: pnpm build:desktop
