[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-agent-core"
version = "0.1.0"
description = "Local Agent Core for the Anime Agent MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "websockets>=15,<16",
  "python-dotenv>=1.0,<2.0"
]

[project.optional-dependencies]
test = [
  "httpx2>=2.12,<3.0"
]
voice = [
  "faster-whisper>=1.2,<2.0",
  "numpy>=2.1,<3.0",
  "sounddevice>=0.5,<1.0"
]
tools = [
  "mss>=9,<11",
  "pyperclip>=1.9,<2.0"
]

[project.scripts]
anime-agent-core = "agent_core.main:run"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
agent_core = ["data/*.json", "data/*.txt"]
