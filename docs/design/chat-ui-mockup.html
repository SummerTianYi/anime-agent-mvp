<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洛天依桌面角色 · 聊天界面设计稿</title>
<style>
  :root {
    --tianyi: #66CCFF;
    --tianyi-deep: #3FA9DC;
    --panel: rgba(10, 16, 28, 0.92);
    --panel-line: rgba(102, 204, 255, 0.16);
    --bubble-yi: #F2F5FA;
    --bubble-yi-text: #2A3140;
    --user-text: #0A2434;
    --jade: #7FD4A8;
    --text: #E8ECF4;
    --text-dim: #8A93A8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 24px;
    background: linear-gradient(135deg, #1a2233 0%, #0d1220 55%, #131b2e 100%);
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    color: var(--text);
  }
  .stage-note { color: var(--text-dim); font-size: 13px; }
  .stage-note b { color: var(--tianyi); font-weight: normal; }

  /* ===== 560×760 透明窗口模拟 ===== */
  .avatar-window {
    position: relative;
    width: 560px;
    height: 760px;
    border-radius: 10px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 70% 55% at 50% 42%, rgba(102,204,255,0.07), transparent 70%),
      linear-gradient(180deg, rgba(20,28,44,0.6), rgba(12,17,28,0.75));
    box-shadow: 0 0 0 1px rgba(102,204,255,0.22), 0 24px 70px rgba(0,0,0,0.55);
  }
  /* 3D 角色渲染区占位（实际由 Godot 渲染洛天依模型） */
  .character-placeholder {
    position: absolute;
    inset: 0 0 46% 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: rgba(138, 147, 168, 0.55);
    user-select: none;
  }
  .character-placeholder .note { font-size: 44px; opacity: 0.6; }
  .character-placeholder .caption { font-size: 12px; letter-spacing: 2px; }
  .character-placeholder .figure {
    width: 120px; height: 200px;
    border-radius: 60px 60px 24px 24px;
    background: linear-gradient(180deg, rgba(102,204,255,0.14), rgba(102,204,255,0.03));
    border: 1px dashed rgba(102,204,255,0.25);
  }

  /* ===== 聊天浮层（窗口底部，只盖住下半身） ===== */
  .chat-overlay {
    position: absolute;
    left: 10px; right: 10px; bottom: 10px;
    background: var(--panel);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--panel-line);
    border-radius: 16px;
    box-shadow: 0 -6px 32px rgba(0,0,0,0.35);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .chat-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    border-bottom: 1px solid var(--panel-line);
  }
  .chat-header .signature {
    font-size: 13px;
    color: var(--tianyi);
    white-space: nowrap;
  }
  .session-select {
    flex: 1;
    min-width: 0;
    background: rgba(102,204,255,0.06);
    color: var(--text);
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 5px 8px;
    font-size: 12px;
    font-family: inherit;
    outline: none;
    cursor: pointer;
  }
  .session-select:hover, .session-select:focus { border-color: var(--panel-line); }
  .session-select option { background: #10182a; color: var(--text); }
  .btn-new {
    background: linear-gradient(135deg, var(--tianyi), var(--tianyi-deep));
    color: var(--user-text);
    border: none;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    transition: filter 0.15s;
  }
  .btn-new:hover { filter: brightness(1.1); }

  /* ===== 气泡区（可滚动） ===== */
  .bubbles {
    height: 300px;
    overflow-y: auto;
    padding: 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scroll-behavior: smooth;
  }
  .bubbles::-webkit-scrollbar { width: 5px; }
  .bubbles::-webkit-scrollbar-thumb { background: rgba(102,204,255,0.25); border-radius: 3px; }
  .bubbles::-webkit-scrollbar-track { background: transparent; }

  .msg { display: flex; gap: 8px; max-width: 88%; }
  .msg.yi { align-self: flex-start; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg .avatar-dot {
    flex: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    margin-top: 2px;
  }
  .msg.yi .avatar-dot { overflow: hidden; }
  .msg.user .avatar-dot {
    background: rgba(127, 212, 168, 0.16);
    border: 1px solid rgba(127, 212, 168, 0.4);
    color: var(--jade);
    font-size: 11px;
  }
  .msg .body { display: flex; flex-direction: column; gap: 3px; }
  .msg.user .body { align-items: flex-end; }
  .msg .bubble {
    padding: 9px 12px;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.65;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .msg.yi .bubble {
    background: var(--bubble-yi);
    color: var(--bubble-yi-text);
    border-top-left-radius: 4px;
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, var(--tianyi), #7DD3F7);
    color: var(--user-text);
    border-top-right-radius: 4px;
  }
  .msg .time { font-size: 10px; color: var(--text-dim); padding: 0 4px; }
  .day-divider {
    align-self: center;
    font-size: 10px;
    color: var(--text-dim);
    background: rgba(102,204,255,0.07);
    padding: 2px 10px;
    border-radius: 10px;
  }

    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }

  .btn-voice, .btn-send {
    flex: none;
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: filter 0.15s, transform 0.05s;
  }
  .btn-voice {
    background: rgba(102,204,255,0.1);
    color: var(--tianyi);
    padding: 0 13px;
    border: 1px solid rgba(102,204,255,0.3);
  }
  .btn-voice.hold { background: rgba(102,204,255,0.25); }
  .btn-send {
    background: linear-gradient(135deg, var(--tianyi), var(--tianyi-deep));
    color: var(--user-text);
    padding: 0 16px;
    font-weight: bold;
  }
  .btn-voice:hover, .btn-send:hover { filter: brightness(1.12); }
  .btn-voice:active, .btn-send:active { transform: scale(0.96); }

  .toast {
    position: absolute;
    left: 50%; bottom: 76px;
    transform: translateX(-50%);
    background: rgba(16, 24, 42, 0.95);
    border: 1px solid var(--panel-line);
    color: var(--text);
    font-size: 12px;
    padding: 7px 14px;
    border-radius: 10px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.25s;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }
</style>

      id: "s2", title: "唱歌相关", msgs: [
        { who: "user", text: "你最推荐新手听你哪首歌？", t: "昨天" },
        { who: "yi",   text: "《普通DISCO》吧，节奏轻快，很多人都是听这首认识我的～", t: "昨天" },
      ]
    },
    {
      id: "s3", title: "新对话", msgs: []
    },
  ];

  let replyIdx = 0;
  const sel = document.getElementById("sessionSelect");
  const bubblesEl = document.getElementById("bubbles");
  const inputEl = document.getElementById("input");
  const toastEl = document.getElementById("toast");
  let current = sessions[0];
  let sessionSeq = 4;

  function renderSelect() {
    sel.innerHTML = "";
    for (const s of sessions) {
      const opt = document.createElement("option");
      opt.value = s.id;
      opt.textContent = s.title;
      if (s === current) opt.selected = true;
      sel.appendChild(opt);
    }
  }

  function renderBubbles() {
    bubblesEl.innerHTML = "";
    if (current.msgs.length === 0) {
      const empty = document.createElement("div");
      empty.className = "day-divider";
      empty.innerHTML = '<span class="avatar-photo empty-avatar"></span>开始和天依聊天吧';
      bubblesEl.appendChild(empty);
    }
    for (const m of current.msgs) appendBubble(m, false);
    bubblesEl.scrollTop = bubblesEl.scrollHeight;
  }

  function appendBubble(m, scroll = true) {
    if (m.who === "day") {
      const d = document.createElement("div");
      d.className = "day-divider";
      d.textContent = m.text;
      bubblesEl.appendChild(d);
      return;
    }
    const wrap = document.createElement("div");
    wrap.className = "msg " + (m.who === "yi" ? "yi" : "user");
    const dot = document.createElement("div");
    dot.className = "avatar-dot";
    if (m.who === "yi") { dot.classList.add("avatar-photo"); } else { dot.textContent = "我"; }
    const body = document.createElement("div");
    body.className = "body";
    const b = document.createElement("div");
    b.className = "bubble";
    b.textContent = m.text;
    const t = document.createElement("div");
    t.className = "time";
    t.textContent = m.t;
    body.appendChild(b);
    body.appendChild(t);
    wrap.appendChild(dot);
    wrap.appendChild(body);
    bubblesEl.appendChild(wrap);
    if (scroll) bubblesEl.scrollTop = bubblesEl.scrollHeight;
  }

  function send() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = "";
    current.msgs.push({ who: "user", text, t: now() });
    appendBubble(current.msgs[current.msgs.length - 1]);
    if (current.msgs.length === 1) { renderSelect(); }
    setTimeout(() => {
      const reply = { who: "yi", text: replies[replyIdx++ % replies.length], t: now() };
      current.msgs.push(reply);
      appendBubble(reply);
    }, 500);
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove("show"), 1800);
  }

  document.getElementById("btnSend").addEventListener("click", send);
  inputEl.addEventListener("keydown", e => { if (e.key === "Enter") send(); });

  document.getElementById("btnNew").addEventListener("click", () => {
    const s = { id: "s" + sessionSeq++, title: "新对话", msgs: [] };
    sessions.unshift(s);
    current = s;
    renderSelect();
    renderBubbles();
    inputEl.focus();
  });

  sel.addEventListener("change", () => {
    current = sessions.find(s => s.id === sel.value);
    renderBubbles();
  });

  const voiceBtn = document.getElementById("btnVoice");
  voiceBtn.addEventListener("mousedown", () => {
    voiceBtn.classList.add("hold");
    voiceBtn.textContent = "聆听中…";
  });
  const voiceRelease = () => {
    if (!voiceBtn.classList.contains("hold")) return;
    voiceBtn.classList.remove("hold");
    voiceBtn.textContent = "按住语音";
    inputEl.value = "（语音转写文本会回填到这里，确认后再发送）";
    toast("原型演示：真实运行时由 faster-whisper 转写");
  };
  voiceBtn.addEventListener("mouseup", voiceRelease);
  voiceBtn.addEventListener("mouseleave", voiceRelease);

  renderSelect();
  renderBubbles();
</script>
</body>
</html>
